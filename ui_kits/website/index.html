<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABLE AI — Expert-AI Studio</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.page{animation:ta-reveal-up .6s var(--ease-standard) both;--reveal-offset:0px;--reveal-blur:0px}
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--text);transform-origin:left;z-index:9999}
.container{width:100%;margin:0 auto;padding:0 20px}@media(min-width:640px){.container{padding:0 32px}}@media(min-width:1024px){.container{padding:0 40px}}
.section{position:relative;overflow:hidden}.section.bt{border-top:1px solid var(--border)}.section.tinted{background:rgba(240,237,239,.5)}
.section-lg{padding:96px 0}.section-xl{padding:112px 0}@media(min-width:1024px){.section-lg{padding:128px 0}.section-xl{padding:144px 0}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(10,22,38,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(10,22,38,.07) 1px,transparent 1px);background-size:60px 60px;opacity:.3;pointer-events:none}
.ring{position:absolute;border:1px solid var(--border);border-radius:50%;pointer-events:none}.ring.square{border-radius:0;transform:rotate(45deg)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(10,22,38,.2)}.dot.static{position:static;display:block;width:6px;height:6px;margin:0 auto 12px;background:rgba(10,22,38,.4)}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.h1-hero{font-size:clamp(40px,7vw,96px);font-weight:300;line-height:.95;letter-spacing:-.03em;margin:0 0 40px}
.hero-lead{max-width:672px;margin:0 0 48px;font-size:20px}
.lead{font-size:18px;font-weight:300;line-height:1.6;color:var(--text-muted);margin:0}
.body{font-size:16px;line-height:1.6;color:var(--text-body);margin:0}.body.muted{color:var(--text-muted)}
.quote{margin:0 0 64px;font-size:clamp(24px,3vw,40px);font-weight:300;line-height:1.35;letter-spacing:-.02em;color:var(--text)}
.overview{margin:0;font-size:clamp(20px,2vw,24px);font-weight:300;line-height:1.6;color:rgba(10,22,38,.8)}
.h2{margin:0;font-size:clamp(24px,2.6vw,32px);font-weight:300;letter-spacing:-.025em;line-height:1.15}.h2.big{font-size:clamp(30px,4vw,48px);line-height:1.1}
.h2-cta{margin:0;font-size:clamp(28px,4vw,48px);font-weight:300;letter-spacing:-.025em;line-height:1.15}
.h1-sub{margin:0;font-size:clamp(32px,5vw,72px);font-weight:300;letter-spacing:-.03em;line-height:1.05;max-width:896px}
.page-hero{position:relative;min-height:70vh;display:flex;align-items:flex-end;overflow:hidden;padding:160px 0 80px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-muted);margin-bottom:48px;text-decoration:none}.back:hover{color:var(--text)}
.scroll-hint{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;animation:ta-reveal-up 1s 2s both}.scroll-hint span{font-size:10px;letter-spacing:var(--ls-track-xl);text-transform:uppercase;color:var(--text-subtle)}.scroll-hint i{width:1px;height:32px;background:linear-gradient(to bottom,rgba(10,22,38,.3),transparent);animation:hint 2s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.stats{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr)}@media(min-width:768px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-cell{padding:40px 16px}.stat-cell+.stat-cell{border-left:1px solid var(--border)}@media(min-width:768px){.stat-cell{padding:56px 32px}}@media(max-width:767px){.stat-cell:nth-child(3){border-left:0;border-top:1px solid var(--border)}.stat-cell:nth-child(4){border-top:1px solid var(--border)}}
.split-4-8,.split-7-5,.split-5-7{display:grid;gap:48px 64px}@media(min-width:1024px){.split-4-8{grid-template-columns:1fr 2fr}.split-7-5{grid-template-columns:7fr 5fr;align-items:end}.split-5-7{grid-template-columns:5fr 7fr}}
.rows{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.rows>*+*>*{border-top:1px solid var(--border)}
.row-12{display:grid;gap:16px 24px;grid-template-columns:1fr}@media(min-width:1024px){.feature-row{grid-template-columns:48px 4fr 7fr}.profile-row{grid-template-columns:3fr 9fr}}
.feature-row{padding:40px 0}.profile-row{padding:32px 0}
.row-num{font-size:12px;letter-spacing:var(--ls-track-lg);color:var(--text-muted)}.row-title{margin:0;font-size:18px;font-weight:500;letter-spacing:-.02em;transition:transform .3s var(--ease-standard)}.feature-row:hover .row-title{transform:translateX(4px)}.row-desc{margin:0;font-size:14px;line-height:1.6;color:var(--text-muted)}
.letter{font-size:48px;font-weight:200;letter-spacing:-.02em;color:rgba(10,22,38,.2);margin-bottom:16px;line-height:1}.letter.left{text-align:left;margin-bottom:24px;font-size:36px;color:rgba(10,22,38,.15)}
.room-num{font-size:30px;font-weight:300;letter-spacing:-.02em;color:rgba(10,22,38,.2);transition:color .5s}.room-num.big{font-size:48px;font-weight:200}
.cards-3{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.initial{width:48px;height:48px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:300;color:var(--text-muted);margin-bottom:16px}.initial.small{width:40px;height:40px;margin:0;font-size:14px}
.inline-link{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-muted);text-decoration:none;position:relative}.inline-link::after{content:"";position:absolute;left:0;bottom:-2px;height:1px;width:0;background:currentColor;transition:width .4s var(--ease-standard)}.inline-link:hover{color:var(--text)}.inline-link:hover::after{width:100%}.inline-link.strong{font-size:12px;font-weight:500;letter-spacing:.025em;color:var(--text)}
.acc{cursor:pointer}.acc-head{display:flex;align-items:center;justify-content:space-between;padding:24px 0}.acc-plus{font-size:18px;color:var(--text-muted);transition:transform .3s var(--ease-standard)}.acc-body{overflow:hidden;transition:max-height .4s var(--ease-standard),opacity .4s var(--ease-standard)}
.partner{cursor:pointer}.partner-row{display:grid;grid-template-columns:32px 40px 1fr auto 32px;gap:16px;align-items:center;padding:32px 0}.partner:hover h3{transform:translateX(4px)}.partner h3{transition:transform .3s var(--ease-standard)}.partner-detail{padding:0 0 32px 88px;max-width:800px}@media(max-width:640px){.partner-row{grid-template-columns:40px 1fr 32px}.partner-row .row-num,.partner-row .ta-badge{display:none}.partner-detail{padding-left:0}}
.map-slot{position:relative;height:clamp(240px,32vw,420px);border:1px solid var(--border);background:rgba(255,255,255,.5) url(../../assets/brand/tableai-brand-hero.jpg) center/cover;background-blend-mode:luminosity}.map-slot::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.72)}
.map-note{position:absolute;left:16px;bottom:12px;font-size:11px;letter-spacing:var(--ls-track-md);text-transform:uppercase;color:var(--text-subtle)}
.map-dot{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent)}.map-dot::after{content:"";position:absolute;inset:-4px;border:1px solid var(--accent);border-radius:50%;animation:ta-pulse-ring 2.4s var(--ease-standard) infinite}
.footer{border-top:1px solid var(--border)}.footer-grid{display:grid;gap:48px;padding:80px 0;grid-template-columns:1fr}@media(min-width:768px){.footer-grid{grid-template-columns:6fr 3fr 3fr}}
.footer-link{font-size:14px;color:rgba(10,22,38,.6);text-decoration:none;transition:color .3s}.footer-link:hover{color:var(--text)}.footer-link.small{font-size:12px;color:var(--text-subtle)}
.footer-bottom{padding:24px 0;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
</style></head>
