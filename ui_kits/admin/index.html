<!-- @startingPoint section="Admin CMS" subtitle="256px sidebar + hairline data tables + dialogs" viewport="1280x760" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABLE AI — Admin Panel</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}
.admin{display:flex;min-height:100vh}
.sb{width:256px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border-line);background:rgba(251,249,250,.6)}
.sb-head{padding:24px;border-bottom:1px solid var(--border-line)}
.sb-mark{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);background:rgba(10,22,38,.06);border:1px solid rgba(10,22,38,.12);color:var(--text)}
.sb-nav{flex:1;padding:16px;display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-muted);text-decoration:none;transition:all var(--dur-fast) var(--ease-standard)}
.sb-item:hover{color:var(--text);background:rgba(240,237,239,.7)}.sb-item.on{color:var(--text);background:var(--accent-wash);font-weight:500;box-shadow:inset 0 0 0 1px rgba(168,139,82,.35)}
.sb-foot{padding:16px;border-top:1px solid var(--border-line);display:flex;flex-direction:column;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(10,22,38,.08);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text)}
.main{flex:1;min-width:0;overflow-y:auto}.main-inner{padding:32px;max-width:1152px}
.grid-3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.table{border:1px solid var(--border);background:var(--bg)}
.tr{display:grid;grid-template-columns:200px 1.2fr 1.2fr 64px 90px 88px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--border);font-size:14px}
.tr.loc{grid-template-columns:1.4fr 1fr 1fr 110px 110px 88px}.tr.par{grid-template-columns:40px 1.6fr 120px 1fr 80px 88px}
.tr:first-child{border-top:0}.tr.th{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);background:rgba(245,243,244,.6)}
.tr:not(.th):hover{background:rgba(245,243,244,.5)}
.cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.num{font-variant-numeric:tabular-nums;color:var(--text-muted)}
.initial{width:32px;height:32px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:300;color:var(--text-muted)}
@media(max-width:900px){.sb{display:none}.tr{grid-template-columns:1fr 1fr 80px}.tr>*:nth-child(3),.tr>*:nth-child(4){display:none}}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="admin.jsx"></script>
</body></html>
