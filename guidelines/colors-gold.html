<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:0}.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:64px;border:1px solid var(--border)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div class="sw"><div class="chip" style="background:#785F2A;border-color:transparent"></div><div style="font-size:12px;font-weight:500">gold-deep (text on white)</div><div class="mono">#785F2A</div></div><div class="sw"><div class="chip" style="background:#A88B52;border-color:transparent"></div><div style="font-size:12px;font-weight:500">gold</div><div class="mono">#A88B52</div></div><div class="sw"><div class="chip" style="background:#E3C284;"></div><div style="font-size:12px;font-weight:500">gold-fixed-dim</div><div class="mono">#E3C284</div></div><div class="sw"><div class="chip" style="background:#FFDEA2;"></div><div style="font-size:12px;font-weight:500">gold-fixed</div><div class="mono">#FFDEA2</div></div><div class="sw"><div class="chip" style="background:rgba(168,139,82,.08);"></div><div style="font-size:12px;font-weight:500">gold-mist (active wash)</div><div class="mono">#A88B52 @ 8%</div></div></div><div style="margin-top:16px;display:flex;align-items:center;gap:12px"><div style="flex:1;height:14px;display:flex;border:1px solid var(--border)"><div style="width:92%;background:#fff"></div><div style="width:8%;background:#A88B52"></div></div><span class="lbl">≤ 8% of visible area</span></div></body></html>
