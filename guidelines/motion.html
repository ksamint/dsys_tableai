<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:0}.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:64px;border:1px solid var(--border)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center">
  <div style="display:flex;flex-direction:column;gap:12px"><div style="height:28px;border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text-muted);animation:ta-reveal-up .8s var(--ease-standard) 0s both">reveal-up · delay 0ms</div><div style="height:28px;border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text-muted);animation:ta-reveal-up .8s var(--ease-standard) 0.1s both">reveal-up · delay 100ms</div><div style="height:28px;border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text-muted);animation:ta-reveal-up .8s var(--ease-standard) 0.2s both">reveal-up · delay 200ms</div><div style="height:1px;width:96px;background:rgba(10,22,38,.3);transform-origin:left;animation:ta-line-expand 1.2s var(--ease-standard) both"></div></div>
  <div style="font-size:12px;line-height:1.9;color:var(--text-muted)"><div><span class="mono" style="color:var(--text)">--ease-out-expo</span> cubic-bezier(0.16, 1, 0.3, 1)</div><div><span class="mono" style="color:var(--text)">--dur-fast/base/slow</span> 300 / 400 / 500 ms — colour, border, lift</div><div><span class="mono" style="color:var(--text)">--dur-reveal</span> 800 ms · <span class="mono" style="color:var(--text)">--dur-line</span> 1200 ms</div><div>Hover: lift −2/−4px or scale 1.02 · Press: scale 0.98 · No bounces, no springs</div></div></div></body></html>
