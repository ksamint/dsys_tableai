<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Micro radii only — 2px controls, square cards, 4px dialogs; full only for switch & avatars" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:0}.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:64px;border:1px solid var(--border)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end"><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:0px"></div><div class="mono" style="color:var(--text)">none · 0px</div><div style="font-size:10px;color:var(--text-muted)">cards, tiles</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:2px"></div><div class="mono" style="color:var(--text)">sm · 2px</div><div style="font-size:10px;color:var(--text-muted)">buttons, inputs, tags</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:4px"></div><div class="mono" style="color:var(--text)">default · 4px</div><div style="font-size:10px;color:var(--text-muted)">dialog, toast, bubbles</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:6px"></div><div class="mono" style="color:var(--text)">md · 6px</div><div style="font-size:10px;color:var(--text-muted)">—</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:8px"></div><div class="mono" style="color:var(--text)">lg · 8px</div><div style="font-size:10px;color:var(--text-muted)">—</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:12px"></div><div class="mono" style="color:var(--text)">xl · 12px</div><div style="font-size:10px;color:var(--text-muted)">—</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><div style="width:56px;height:56px;border:1px solid #0A1626;border-radius:9999px"></div><div class="mono" style="color:var(--text)">full · 9999px</div><div style="font-size:10px;color:var(--text-muted)">switch, avatar</div></div></div></body></html>
