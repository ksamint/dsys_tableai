<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:0}.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}.sw{display:flex;flex-direction:column;gap:8px;min-width:0}.chip{height:64px;border:1px solid var(--border)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div><div style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:.02em;border-radius:2px;border:1px solid #0A1626;background:#fff;color:#0A1626;">Learn More</div><div class="lbl" style="margin-top:10px">Default</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:.02em;border-radius:2px;border:1px solid #0A1626;background:#fff;color:#0A1626;box-shadow:inset 0 -1px 0 #A88B52;">Learn More</div><div class="lbl" style="margin-top:10px">Hover</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:.02em;border-radius:2px;border:1px solid #A88B52;background:rgba(168,139,82,.08);color:#0A1626;">Learn More</div><div class="lbl" style="margin-top:10px">Active</div></div><div><div style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:.02em;border-radius:2px;border:1px solid transparent;background:rgba(10,22,38,.07);color:transparent;animation:ta-skeleton 1.8s var(--ease-standard) infinite">Learn More</div><div class="lbl" style="margin-top:10px">Loading</div></div></div>
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center"><div style="flex:1;height:1px;background:var(--border)"></div><span class="mono">press: scale(0.98) · focus: 1px gold outline, 2px offset · disabled: 45% opacity</span></div></body></html>
