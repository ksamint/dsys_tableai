<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { ChatMessage, ChatComposer } = window.TABLEAIDesignSystem_6a9d5e;
function Demo(){
  const [msgs,setMsgs]=React.useState([
    {role:"system",text:"Session opened · Hong Kong node"},
    {role:"human",text:"Settle the Basel engagement and split contributions.",time:"09:41"},
    {role:"agent",meta:"Agent · Settlement",text:"Contribution split computed: 3 parties, zero-trust ledger verified. Awaiting expert sign-off from the Basel node."},
  ]);
  const [pending,setPending]=React.useState(false);
  const send=t=>{setMsgs(m=>[...m,{role:"human",text:t}]);setPending(true);setTimeout(()=>{setMsgs(m=>[...m,{role:"agent",meta:"Agent · OPC Expert",text:"Acknowledged. Routing to a human-in-the-loop reviewer."}]);setPending(false);},1200);};
  return <div style={{border:"1px solid var(--border)",display:"flex",flexDirection:"column",height:360,background:"var(--bg)"}}>
    <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:16}}>
      {msgs.map((m,i)=><ChatMessage key={i} role={m.role} meta={m.meta} time={m.time}>{m.text}</ChatMessage>)}
      {pending?<ChatMessage role="agent" pending />:null}
    </div>
    <ChatComposer onSend={send} loading={pending} suggestions={msgs.length<4?["Explain the AHA architecture","Which hubs are in Europe?"]:[]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
