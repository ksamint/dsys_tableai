<body><div id="root"></div>
<script type="text/babel">
const { Card, TileGrid, Badge, Tag, Eyebrow, Stat, Divider, Skeleton } = window.TableAIDesignSystem_f48f27;
function Demo(){

    <TileGrid columns={3} style={{marginBottom:16}}>
      <Card variant="tile" padding={20} number="01" eyebrow="Trust Threshold" title="Zero-Trust Settlement" description="Data usable but invisible; instant multi-party clearing." footer="Learn more →" arrow href="#" />
      <Card variant="tile" padding={20} number="02" eyebrow="Experience Threshold" title="OPC Global Network" description="Human-in-the-loop expert network across 7 hubs." footer="Learn more →" arrow href="#" />

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:16,alignItems:"center"}}>
      <div style={{display:"flex",gap:0,borderTop:"1px solid var(--border)",borderBottom:"1px solid var(--border)",padding:"12px 0",gridColumn:"span 2"}}>
        <Stat value={7} suffix="+" label="Hub Nodes" size="sm" style={{flex:1}} countUp /><Divider vertical /><Stat value={100} suffix="%" label="Auto Settlement" size="sm" accent style={{flex:1}} /><Divider vertical /><Stat value="AHA" label="Architecture" size="sm" style={{flex:1}} />
      </div>

      <div style={{width:120,display:"flex",flexDirection:"column",gap:8}}><Skeleton width={120} height={16} /><Skeleton lines={2} height={8} /><Divider variant="gold" width={32} /></div>
    </div>

ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
