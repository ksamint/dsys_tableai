<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { NavBar, Tabs } = window.TableAIDesignSystem_f48f27;
const items=[{href:"/protocol",label:"Protocol"},{href:"/network",label:"Network"},{href:"/business",label:"AI Labs"},{href:"/about",label:"About"}];
function Demo(){
  const [path,setPath]=React.useState("/network");const [lang,setLang]=React.useState("en");const [tab,setTab]=React.useState("content");
  return <div>
    <NavBar logoSrc="../../assets/logo/tableai-a2a-mark.svg" items={items} activeHref={path} onNavigate={setPath} lang={lang} onToggleLang={()=>setLang(l=>l==="zh"?"en":"zh")} glass height={64} style={{position:"relative"}} />
    <div style={{padding:"20px 24px 0"}}>
      <Tabs items={[{label:"Content",value:"content",count:28},{label:"Locations",value:"loc",count:7},{label:"Partners",value:"partners",count:8},{label:"Users",value:"users"},{label:"Settings",value:"settings",disabled:true}]} value={tab} onChange={setTab} />
      <div style={{padding:"16px 0",fontSize:13,color:"var(--text-muted)"}}>Selected: <span style={{color:"var(--text)"}}>{tab}</span> · Route: <span style={{color:"var(--text)"}}>{path}</span> · Lang: <span style={{color:"var(--text)"}}>{lang}</span></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
